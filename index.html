<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeynep ❤️</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif; 
        }

        /* PIXEL ART CANLI SAHİL CANVAS ARKA PLAN */
        #pixelBgCanvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
            pointer-events: none; 
            display: block; 
        }

        /* --- GİRİŞ EKRANI --- */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 6000; transition: opacity 0.8s ease; }
        #loginOverlay input { padding: 12px 20px; border-radius: 20px; border: 2px solid #ff0055; background: #111; color: white; margin-bottom: 15px; text-align: center; font-size: 16px; outline: none; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }
        
        /* --- KALP ANIMASYON EKRANI --- */
        #heartAnimOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a020c 0%, #000000 100%); z-index: 5000; opacity: 1; transition: opacity 1s ease; flex-direction: column; align-items: center; justify-content: center; }
        #heartCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #enterSiteBtn { display: none; position: absolute; bottom: 12%; padding: 14px 35px; background: linear-gradient(135deg, #ff0055, #ff5599); color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 0 25px #ff0055, 0 0 50px rgba(255, 0, 85, 0.5); opacity: 0; transition: opacity 1.5s ease, transform 0.3s ease; z-index: 5001; }
        #enterSiteBtn:hover { transform: scale(1.08); box-shadow: 0 0 35px #ff0055, 0 0 70px rgba(255, 0, 85, 0.8); }

        /* --- ANA SİTE ÖĞELERİ --- */
        #text { font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; animation: pulse 2s infinite; z-index: 10; display: none; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; color: #ff0055; } }
        
        #gallery { position: relative; width: 280px; height: 380px; border-radius: 20px; overflow: hidden; box-shadow: 0 0 25px rgba(255,0,85,0.3); border: 2px solid rgba(255,255,255,0.1); background: #111; z-index: 10; display: none; }
        .slide { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease; display: none; }
        .active { opacity: 1; display: block; }

        #anilarOverlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; background: rgba(15, 15, 15, 0.98); border: 2px solid #ff0055; border-radius: 20px; z-index: 4000; padding: 20px; flex-direction: column; align-items: center; box-shadow: 0 0 30px #ff0055; }
        .video-container { width: 100%; height: 180px; background: #000; border-radius: 10px; margin-bottom: 15px; overflow: hidden; border: 1px solid #333; }
        #aniVideo { width: 100%; height: 100%; object-fit: contain; }
        .num-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; margin-bottom: 15px; }
        .num-btn { background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .num-btn:hover { background: #ff0055; border-color: #fff; }
        .close-ani-btn { background: #ff0055; color: white; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* --- MEDYA ARŞİVİ PANELİ --- */
        #archiveOverlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85vw; max-width: 700px; height: 80vh; background: rgba(12, 12, 16, 0.98); border: 2px solid #ff0055; border-radius: 20px; z-index: 4500; padding: 20px; flex-direction: column; box-shadow: 0 0 40px rgba(255,0,85,0.6); }
        .archive-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .archive-content { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding-right: 5px; }
        .archive-item { background: #1a1a24; border: 1px solid #333; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 8px; }
        .archive-item img, .archive-item video { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
        .archive-date { font-size: 10px; color: #ffb6c1; margin-top: 6px; text-align: center; }
        .archive-upload-area { margin-top: 15px; border-top: 1px solid #333; padding-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .archive-upload-area input[type="file"] { color: white; font-size: 11px; }

        #controls { margin-top: 15px; display: none; flex-direction: column; align-items: center; gap: 10px; z-index: 20; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
        .control-btn { background: rgba(30, 30, 30, 0.9); border: 1px solid #444; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 11px; }
        .ani-btn { background: #ff0055 !important; font-weight: bold; }
        
        #musicPlayer { background: rgba(20, 20, 20, 0.9); padding: 12px; border-radius: 20px; width: 320px; border: 1px solid #333; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        #songImg { width: 40px; height: 40px; border-radius: 8px; }
        #progressBar { width: 100%; height: 5px; background: #333; border-radius: 3px; cursor: pointer; margin-top: 8px; }
        #progressFill { width: 0%; height: 100%; background: #ff0055; border-radius: 3px; }

        .snowflake, .kitty-rain { position: fixed; top: -60px; pointer-events: none; animation: fall linear infinite; z-index: 5; }
        .kitty-rain { width: 40px; height: auto; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        #chatOverlay { display: none; position: fixed; top: 15%; right: 5%; width: 300px; height: 400px; background: rgba(15,15,20,0.95); border: 2px solid #ff0055; border-radius: 15px; z-index: 2000; flex-direction: column; padding: 10px; }
        #chatBox { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; padding: 5px; }
        .chat-msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 13px; word-wrap: break-word; display: flex; flex-direction: column; }
        .msg-own { align-self: flex-end; background: #ff0055; color: white; }
        .msg-other { align-self: flex-start; background: #333; color: white; }
        .msg-time { font-size: 9px; opacity: 0.7; margin-top: 4px; align-self: flex-end; }
        #chatInputArea { display: flex; gap: 5px; }
        #chatInput { flex: 1; padding: 8px; border-radius: 20px; border: none; background: #222; color: white; }

        #gameOverlayScreen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.98); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; }
        .board-grid { display: grid; grid-template-columns: repeat(8, 35px); grid-template-rows: repeat(8, 35px); gap: 2px; background: #222; padding: 10px; border-radius: 8px; }
        .board-cell { width: 35px; height: 35px; background: #111; border: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .board-cell.filled { background: #ff0055; box-shadow: 0 0 10px #ff0055; border-color: #fff; }
        .direction-btn { width: 100px; height: 100px; font-size: 25px; border-radius: 20px; border: none; cursor: pointer; background: #333; color: white; }
        
        #bottomBtns { display: none; position:fixed; bottom: 30px; left: 30px; z-index: 100; }
        #gamesMenu { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; border: 2px solid #00ffff; padding: 20px; border-radius: 15px; z-index: 2500; width: 250px; text-align: center; }
    </style>
</head>
<body>

    <!-- PIXEL ARKA PLAN CANVAS -->
    <canvas id="pixelBgCanvas"></canvas>

    <!-- 1. ADIM: İSİM GİRİŞ EKRANI -->
    <div id="loginOverlay">
        <h2 style="color:#ff0055">Hoş Geldin ❤️</h2>
        <input type="text" id="nameInput" placeholder="İsmini girer misin?">
        <button onclick="submitName()" style="background:#ff0055; color:white; border:none; padding:10px 30px; border-radius:20px; cursor:pointer; font-weight:bold;">Devam Et</button>
    </div>

    <!-- 2. ADIM: I LOVE YOU + KALP ANIMASYON EKRANI -->
    <div id="heartAnimOverlay">
        <canvas id="heartCanvas"></canvas>
        <button id="enterSiteBtn" onclick="enterMainSite()">Siteye Giriş Yap ✨</button>
    </div>

    <!-- 3. ADIM: ANA SİTE İÇERİĞİ -->
    <div id="text">SENİ SEVİYORUM ZEYNEP ❤️</div>
    <div id="gallery"></div>

    <!-- ANILAR VİDEO MODALI -->
    <div id="anilarOverlay">
        <div class="video-container">
            <video id="aniVideo" controls></video>
        </div>
        <div class="num-grid">
            <button class="num-btn" onclick="playMemory(1)">1</button>
            <button class="num-btn" onclick="playMemory(2)">2</button>
            <button class="num-btn" onclick="playMemory(3)">3</button>
            <button class="num-btn" onclick="playMemory(4)">4</button>
            <button class="num-btn" onclick="playMemory(5)">5</button>
            <button class="num-btn" onclick="playMemory(6)">6</button>
            <button class="num-btn" onclick="playMemory(7)">7</button>
            <button class="num-btn" onclick="playMemory(8)">8</button>
        </div>
        <button class="close-ani-btn" onclick="closeAnilar()">Kapat</button>
    </div>

    <!-- MEDYA ARŞİVİ PENCERESİ -->
    <div id="archiveOverlay">
        <div class="archive-header">
            <h3 style="color: #ff0055; margin:0;">📸 Fotoğraf & Video Arşivi</h3>
            <button onclick="toggleArchive()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">✖</button>
        </div>
        <div class="archive-content" id="archiveGrid">
            <!-- Otomatik ve Kalıcı Medyalar Buraya Yüklenecek -->
        </div>
        <div class="archive-upload-area">
            <input type="file" id="mediaFileInput" accept="image/*,video/*">
            <button onclick="uploadLocalMedia()" style="background:#ff0055; color:white; border:none; padding:8px 15px; border-radius:10px; font-weight:bold; cursor:pointer;">Galeriden Ekle ✨</button>
        </div>
    </div>

    <div id="bottomBtns">
        <button onclick="openGamesMenu()" style="background:#00ffff; color:black; border:none; padding:12px; border-radius:25px; font-weight:bold; cursor:pointer; width:140px; margin-bottom:10px;">🎮 Oyunlar</button><br>
        <button onclick="toggleChat()" style="background:#ff0055; color:white; border:none; padding:12px; border-radius:25px; font-weight:bold; cursor:pointer; width:140px;">💬 Sohbet</button>
    </div>

    <div id="chatOverlay">
        <div id="chatBox"></div>
        <div id="chatInputArea">
            <input type="text" id="chatInput" placeholder="Mesaj yaz...">
            <button onclick="sendFirebaseMsg()" style="background:#ff0055; border:none; color:white; border-radius:50%; width:35px; height:35px; cursor:pointer;">➔</button>
        </div>
        <button onclick="toggleChat()" style="background:none; color:gray; border:none; margin-top:5px; cursor:pointer; font-size:11px;">Kapat</button>
    </div>

    <div id="gamesMenu">
        <h3 style="color:#00ffff">Bir Oyun Seç</h3>
        <button onclick="showBlockBlast()" style="width:100%; padding:10px; margin:5px 0; border-radius:10px; cursor:pointer;">🌟 Block Blast</button>
        <button onclick="showLearningGame()" style="width:100%; padding:10px; margin:5px 0; border-radius:10px; cursor:pointer;">🧭 Sol mu, Sağ mı?</button>
        <button onclick="closeGamesMenu()" style="background:none; color:white; border:none; cursor:pointer; margin-top:10px;">Vazgeç</button>
    </div>

    <div id="gameOverlayScreen">
        <div id="blockBlastContent" style="display:none; text-align:center;">
            <h2 style="color:#ff0055">BLOCK BLAST</h2>
            <div class="board-grid" id="mainGameGrid"></div>
            <button onclick="initBlockBlast()" style="margin-top:10px; background:#444; color:white; border:none; padding:5px 15px; border-radius:10px;">Temizle</button><br>
            <button onclick="backToMenu()" style="margin-top:20px; padding:10px 20px; background:#444; color:white; border:none; border-radius:20px; cursor:pointer;">Geri Dön</button>
        </div>

        <div id="learningGame" style="display:none; text-align:center;">
            <div id="qText" style="font-size:22px; margin-bottom:30px; color:#ffb6c1;"></div>
            <div style="display:flex; gap:20px;">
                <button class="direction-btn" onclick="checkDir('Sol')">⬅️<br>SOL</button>
                <button class="direction-btn" onclick="checkDir('Sağ')">SAĞ ➡️</button>
            </div>
            <p id="learnFeedback" style="margin-top:20px; font-weight:bold;"></p>
            <button onclick="backToMenu()" style="margin-top:30px; padding:10px 20px; background:#444; color:white; border:none; border-radius:20px; cursor:pointer;">Geri Dön</button>
        </div>
    </div>

    <div id="controls">
        <div class="btn-group">
            <button class="control-btn" onclick="changeBG()">🖼️ Manzara Değiştir</button>
            <button class="control-btn" onclick="toggleRain()">🎀 Kitty Yağmuru</button>
            <button class="control-btn ani-btn" onclick="openAnilar()">🎬 ANILARIMIZ</button>
            <button class="control-btn" onclick="toggleArchive()" style="background:#ff66aa; font-weight:bold;">📸 Arşiv</button>
        </div>
        <div id="musicPlayer">
            <div class="player-info">
                <img id="songImg" src="kapak8.jpeg.jpeg">
                <div id="songName" style="font-size:12px">Yükleniyor...</div>
            </div>
            <div id="progressBar" onclick="seek(event)"><div id="progressFill"></div></div>
            <div style="text-align:center; margin-top:10px;">
                <button onclick="prev()" style="background:none; border:none; color:white; cursor:pointer;">⏮</button>
                <button id="pBtn" onclick="pPause()" style="background:none; border:none; color:#ff0055; font-size:22px; cursor:pointer; margin:0 15px;">⏸</button>
                <button onclick="next()" style="background:none; border:none; color:white; cursor:pointer;">⏭</button>
            </div>
        </div>
    </div>

    <audio id="audio"></audio>

    <!-- KANAL / CANLI PIXEL MANZARA & PLAJ GEL-GİT DALGA MOTORU -->
    <script>
        const pCanvas = document.getElementById('pixelBgCanvas');
        const pCtx = pCanvas.getContext('2d');

        function resizePixelCanvas() {
            pCanvas.width = window.innerWidth;
            pCanvas.height = window.innerHeight;
        }
        resizePixelCanvas();
        window.addEventListener('resize', resizePixelCanvas);

        let waveTime = 0;
        let windTime = 0;
        const fireworks = [];

        // Havai Fişekler
        class PixelFirework {
            constructor() {
                this.x = Math.random() * pCanvas.width * 0.5;
                this.y = pCanvas.height;
                this.targetY = Math.random() * (pCanvas.height * 0.25) + 30;
                this.speed = Math.random() * 3 + 4;
                this.exploded = false;
                this.particles = [];
                this.colors = ['#ffffff', '#ff66aa', '#d9407a', '#ff99c2'];
            }

            update() {
                if (!this.exploded) {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        this.exploded = true;
                        const pCount = 20;
                        const baseColor = this.colors[Math.floor(Math.random() * this.colors.length)];
                        for (let i = 0; i < pCount; i++) {
                            const angle = (Math.PI * 2 / pCount) * i;
                            const force = Math.random() * 2 + 1;
                            this.particles.push({
                                x: this.x,
                                y: this.y,
                                vx: Math.cos(angle) * force,
                                vy: Math.sin(angle) * force,
                                life: 25 + Math.random() * 15,
                                color: baseColor
                            });
                        }
                    }
                } else {
                    this.particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.04;
                        p.life--;
                    });
                }
            }

            draw() {
                const px = 4;
                if (!this.exploded) {
                    pCtx.fillStyle = '#ffffff';
                    pCtx.fillRect(Math.floor(this.x / px) * px, Math.floor(this.y / px) * px, px, px * 2);
                } else {
                    this.particles.forEach(p => {
                        if (p.life > 0) {
                            pCtx.fillStyle = p.color;
                            pCtx.fillRect(Math.floor(p.x / px) * px, Math.floor(p.y / px) * px, px, px);
                        }
                    });
                }
            }
        }

        // Palmiye Çizimi
        function drawPixelPalmTree(x, y, scale) {
            pCtx.fillStyle = '#0a0a0a';
            for (let i = 0; i < 35; i++) {
                let sway = Math.sin(windTime + i * 0.1) * (i / 12);
                pCtx.fillRect(x - i * 0.8 + sway, y - i * 3, scale * 3.5, scale * 3.5);
            }
            const topX = x - 28 + Math.sin(windTime + 3) * 2;
            const topY = y - 105;
            pCtx.fillStyle = '#d9407a';
            for (let angle = 0; angle < Math.PI * 2; angle += 0.6) {
                for (let d = 0; d < 26; d++) {
                    let px = topX + Math.cos(angle) * d * 2.2;
                    let py = topY + Math.sin(angle) * d * 1.3;
                    pCtx.fillRect(px, py, scale * 2, scale * 2);
                }
            }
        }

        // Pixel Deniz Yıldızı Çizimi
        function drawStarfish(x, y, color) {
            pCtx.fillStyle = color;
            pCtx.fillRect(x, y - 4, 3, 11);
            pCtx.fillRect(x - 4, y, 11, 3);
            pCtx.fillRect(x - 2, y - 2, 7, 7);
        }

        // Pixel Yengeç Çizimi
        function drawCrab(x, y, timeOffset) {
            let legWalk = Math.sin(windTime * 5 + timeOffset) > 0 ? 2 : 0;
            pCtx.fillStyle = '#ff2a75';
            pCtx.fillRect(x, y, 10, 6); // Gövde
            pCtx.fillRect(x - 3, y - 3, 3, 3); // Sol kıskaç
            pCtx.fillRect(x + 10, y - 3, 3, 3); // Sağ kıskaç
            pCtx.fillStyle = '#ffffff';
            pCtx.fillRect(x + 2, y + 1, 2, 2); // Göz 1
            pCtx.fillRect(x + 6, y + 1, 2, 2); // Göz 2
            pCtx.fillStyle = '#0a0a0a';
            pCtx.fillRect(x - 1, y + 6 + legWalk, 2, 2); // Bacaklar
            pCtx.fillRect(x + 9, y + 6 - legWalk, 2, 2);
        }

        function drawPixelScene() {
            if (pCanvas.style.display === 'none') return; // Eğer başka arka fon aktifse canvas'ı yorma

            const w = pCanvas.width;
            const h = pCanvas.height;

            waveTime += 0.025;
            windTime += 0.02;

            // 1. Siyah Gökyüzü Zemin
            pCtx.fillStyle = '#050206';
            pCtx.fillRect(0, 0, w, h);

            // Havai Fişekler
            if (Math.random() < 0.018) {
                fireworks.push(new PixelFirework());
            }
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].exploded && fireworks[i].particles.every(p => p.life <= 0)) {
                    fireworks.splice(i, 1);
                }
            }

            // Beyaz Bulutlar
            pCtx.fillStyle = '#ffffff';
            pCtx.fillRect(w * 0.15, h * 0.18, 110, 16);
            pCtx.fillRect(w * 0.18, h * 0.14, 60, 14);

            // 2. Sağ Dağ & Orman Tepesi
            pCtx.fillStyle = '#260815';
            pCtx.beginPath();
            pCtx.moveTo(w * 0.48, h * 0.58);
            pCtx.lineTo(w * 0.75, h * 0.25);
            pCtx.lineTo(w, h * 0.38);
            pCtx.lineTo(w, h * 0.58);
            pCtx.fill();

            pCtx.fillStyle = '#400d23';
            pCtx.beginPath();
            pCtx.moveTo(w * 0.55, h * 0.58);
            pCtx.lineTo(w * 0.82, h * 0.32);
            pCtx.lineTo(w, h * 0.45);
            pCtx.lineTo(w, h * 0.58);
            pCtx.fill();

            // Palmiye Ağacı
            drawPixelPalmTree(w * 0.82, h * 0.56, 2.8);

            // 3. Sol Kayalıklar
            pCtx.fillStyle = '#121212';
            pCtx.beginPath();
            pCtx.moveTo(0, h * 0.56);
            pCtx.lineTo(w * 0.25, h * 0.46);
            pCtx.lineTo(w * 0.42, h * 0.56);
            pCtx.lineTo(0, h * 0.56);
            pCtx.fill();

            // 4. PEMBE DENİZ (Üst Durgun Su)
            const seaY = h * 0.56;
            pCtx.fillStyle = '#801a47';
            pCtx.fillRect(0, seaY, w, h * 0.12);

            // --- 5. KUMSAL VE GEL-GİT DALGA ALANI ---
            const beachTopY = h * 0.65;
            const beachHeight = h * 0.18;
            const beachBottomY = beachTopY + beachHeight;

            pCtx.fillStyle = '#2a0a18';
            pCtx.fillRect(0, beachTopY, w, beachHeight + 10);

            const waveReach = (Math.sin(waveTime) + 1) / 2; 
            const tideY = beachTopY + waveReach * (beachHeight * 0.85);

            pCtx.fillStyle = '#48102a';
            pCtx.fillRect(0, beachTopY, w, tideY - beachTopY);

            pCtx.fillStyle = '#a6245c';
            pCtx.beginPath();
            pCtx.moveTo(0, beachTopY);
            for (let x = 0; x <= w; x += 10) {
                const waveRipple = Math.sin(x * 0.02 + waveTime * 2) * 5;
                pCtx.lineTo(x, tideY + waveRipple);
            }
            pCtx.lineTo(w, beachTopY);
            pCtx.closePath();
            pCtx.fill();

            pCtx.fillStyle = '#ffffff';
            for (let x = 0; x <= w; x += 6) {
                const waveRipple = Math.sin(x * 0.02 + waveTime * 2) * 5;
                const foamY = tideY + waveRipple;
                pCtx.fillRect(x, foamY, 8, 3);
                if (waveReach < 0.5 && Math.random() < 0.3) {
                    pCtx.fillRect(x, foamY - Math.random() * 15, 3, 2);
                }
            }

            pCtx.fillStyle = '#0a0a0a';
            pCtx.fillRect(0, beachBottomY, w, h - beachBottomY);

            drawStarfish(w * 0.15, beachBottomY - 20, '#ff66aa');
            drawStarfish(w * 0.72, beachBottomY - 15, '#ff2a75');
            drawStarfish(w * 0.88, beachBottomY - 35, '#ffffff');

            const crab1X = (w * 0.25 + Math.cos(windTime) * 30);
            drawCrab(crab1X, beachBottomY - 25, 0);

            const crab2X = (w * 0.62 + Math.sin(windTime * 0.8) * 20);
            drawCrab(crab2X, beachBottomY - 18, 1.5);

            requestAnimationFrame(drawPixelScene);
        }

        drawPixelScene();
    </script>

    <!-- SİTE FONKSİYONLARI -->
    <script>
        function submitName() {
            const input = document.getElementById("nameInput");
            if(input.value.trim()) {
                window.userName = input.value.trim();
                document.getElementById("loginOverlay").style.opacity = "0";
                setTimeout(() => {

                    startHeartAnimation(window.userName);
                }, 800);
            } else {
                alert("Lütfen bir isim gir!");
            }
        }

        let animId;
        function startHeartAnimation(name) {
            const overlay = document.getElementById("heartAnimOverlay");
            overlay.style.display = "flex";
            
            const canvas = document.getElementById("heartCanvas");
            const ctx = canvas.getContext("2d");
            
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 1200;
            let phase = 'text'; 
            let phaseTimer = 0;

            const textTargetPoints = [];
            const heartTargetPoints = [];

            const textCanvas = document.createElement('canvas');
            const textCtx = textCanvas.getContext('2d');
            textCanvas.width = width;
            textCanvas.height = height;

            textCtx.fillStyle = "white";
            textCtx.font = "bold " + Math.min(width / 11, 60) + "px sans-serif";
            textCtx.textAlign = "center";
            textCtx.textBaseline = "middle";
            textCtx.fillText("I LOVE YOU " + name.toUpperCase(), width / 2, height / 2);

            const imgData = textCtx.getImageData(0, 0, width, height).data;
            const step = 5;
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const alpha = imgData[(y * width + x) * 4 + 3];
                    if (alpha > 128) {
                        textTargetPoints.push({ x, y });
                    }
                }
            }

            const heartScale = Math.min(width, height) / 45;
            for (let i = 0; i < particleCount; i++) {
                const t = Math.PI * 2 * (i / particleCount);
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                heartTargetPoints.push({
                    x: width / 2 + x * heartScale,
                    y: height / 2 + y * heartScale - 20
                });
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2;
                    this.size = Math.random() * 2 + 1.5;
                    this.color = `#ff${Math.floor(Math.random()*150).toString(16).padStart(2,'0')}aa`;
                    this.targetX = this.x;
                    this.targetY = this.y;
                    this.friction = 0.92;
                    this.ease = 0.04;
                }

                update() {
                    if (phase === 'text' || phase === 'heart') {
                        const dx = this.targetX - this.x;
                        const dy = this.targetY - this.y;
                        this.vx += dx * this.ease * 0.1;
                        this.vy += dy * this.ease * 0.1;
                        this.vx *= this.friction;
                        this.vy *= this.friction;
                        this.x += this.vx;
                        this.y += this.vy;
                    } else if (phase === 'exploded') {
                        this.x += this.vx;
                        this.y += this.vy;
                        this.vx *= 0.98;
                        this.vy *= 0.98;
                    }
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ff0055";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function assignTargets(targets) {
                for (let i = 0; i < particles.length; i++) {
                    const target = targets[i % targets.length];
                    particles[i].targetX = target.x + (Math.random() - 0.5) * 5;
                    particles[i].targetY = target.y + (Math.random() - 0.5) * 5;
                }
            }

            assignTargets(textTargetPoints);

            function animate() {
                ctx.fillStyle = 'rgba(10, 0, 5, 0.25)';
                ctx.fillRect(0, 0, width, height);

                phaseTimer++;

                if (phase === 'text' && phaseTimer > 180) {
                    phase = 'heart';
                    assignTargets(heartTargetPoints);
                } else if (phase === 'heart' && phaseTimer > 360) {
                    phase = 'exploded';
                    particles.forEach(p => {
                        const angle = Math.random() * Math.PI * 2;
                        const force = Math.random() * 12 + 4;
                        p.vx = Math.cos(angle) * force;
                        p.vy = Math.sin(angle) * force;
                    });
                    
                    const btn = document.getElementById("enterSiteBtn");
                    btn.style.display = "block";
                    setTimeout(() => { btn.style.opacity = "1"; }, 100);
                }

                if (phase === 'heart') {
                    const beat = Math.sin(phaseTimer * 0.1) * 3;
                    particles.forEach(p => {
                        p.x += (p.x - width/2) * 0.005 * beat;
                        p.y += (p.y - height/2) * 0.005 * beat;
                    });
                }

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                animId = requestAnimationFrame(animate);
            }

            animate();
        }
