<html lang="tr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body { 
            margin: 0;

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 6000; transition: opacity 0.8s ease; }
        #loginOverlay input { padding: 12px 20px; border-radius: 20px; border: 2px solid #ff0055; background: #111; color: white; margin-bottom: 15px; text-align: center; font-size: 16px; outline: none; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }
        
        /* --- KALP ANIMASYON EKRANI --- */
        #heartAnimOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a020c 0%, #000000 100%); z-index: 5000; opacity: 1; transition: opacity 1s ease; flex-direction: column; align-items: center; justify-content: center; }
        #heartCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #enterSiteBtn { display: none; position: absolute; bottom: 12%; padding: 14px 35px; background: linear-gradient(135deg, #ff0055, #ff5599); color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 0 25px #ff0055, 0 0 50px rgba(255, 0, 85, 0.5); opacity: 0; transition: opacity 1.5s ease, transform 0.3s ease; z-index: 5001; }

        #gallery { position: relative; width: 280px; height: 380px; border-radius: 20px; overflow: hidden; box-shadow: 0 0 25px rgba(255,0,85,0.3); border: 2px solid rgba(255,255,255,0.1); background: #111; z-index: 10; display: none; }

        .num-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; margin-bottom: 15px; }

        #progressBar { width: 100%; height: 5px; background: #333; border-radius: 3px; cursor: pointer; margin-top: 8px; }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuucW14XJoKejyWgFCQoWt0F6NBbQD5Ao",
            authDomain: "zeynep-945d0.firebaseapp.com",
            databaseURL: "https://zeynep-945d0-default-rtdb.firebaseio.com",
            projectId: "zeynep-945d0",
            storageBucket: "zeynep-945d0.firebasestorage.app",

            appId: "1:419113744567:web:730c97bc93cd3267ccb532"
        };

        const app = initializeApp(firebaseConfig);

        window.sendFirebaseMsg = function() {
            const input = document.getElementById("chatInput");

    <!-- SİTE FONKSİYONLARI -->
    <script>
        function submitName() {
            const input = document.getElementById("nameInput");
            if(input.value.trim()) {
                window.userName = input.value.trim();
                document.getElementById("loginOverlay").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("loginOverlay").style.display = "none";
                    startHeartAnimation(window.userName);
                }, 800);
            } else {
                alert("Lütfen bir isim gir!");
            }
        }

        let animId;
        function startHeartAnimation(name) {
            const overlay = document.getElementById("heartAnimOverlay");
            overlay.style.display = "flex";
            
            const canvas = document.getElementById("heartCanvas");
            const ctx = canvas.getContext("2d");
            
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            const particles = [];
            const particleCount = 1200;
            let phase = 'text'; 
            let phaseTimer = 0;

            const textTargetPoints = [];
            const heartTargetPoints = [];

            const textCanvas = document.createElement('canvas');
            const textCtx = textCanvas.getContext('2d');
            textCanvas.width = width;
            textCanvas.height = height;

            textCtx.fillStyle = "white";
            textCtx.font = "bold " + Math.min(width / 11, 60) + "px sans-serif";
            textCtx.textAlign = "center";
            textCtx.textBaseline = "middle";
            textCtx.fillText("I LOVE YOU " + name.toUpperCase(), width / 2, height / 2);

            const imgData = textCtx.getImageData(0, 0, width, height).data;
            const step = 5;
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const alpha = imgData[(y * width + x) * 4 + 3];
                    if (alpha > 128) {
                        textTargetPoints.push({ x, y });
                    }
                }
            }

            const heartScale = Math.min(width, height) / 45;
            for (let i = 0; i < particleCount; i++) {
                const t = Math.PI * 2 * (i / particleCount);
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                heartTargetPoints.push({
                    x: width / 2 + x * heartScale,
                    y: height / 2 + y * heartScale - 20
                });
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2;
                    this.size = Math.random() * 2 + 1.5;
                    this.color = `#ff${Math.floor(Math.random()*150).toString(16).padStart(2,'0')}aa`;
                    this.targetX = this.x;
                    this.targetY = this.y;
                    this.friction = 0.92;
                    this.ease = 0.04;
                }

                update() {
                    if (phase === 'text' || phase === 'heart') {
                        const dx = this.targetX - this.x;
                        const dy = this.targetY - this.y;
                        this.vx += dx * this.ease * 0.1;
                        this.vy += dy * this.ease * 0.1;
                        this.vx *= this.friction;
                        this.vy *= this.friction;
                        this.x += this.vx;
                        this.y += this.vy;
                    } else if (phase === 'exploded') {
                        this.x += this.vx;
                        this.y += this.vy;
                        this.vx *= 0.98;
                        this.vy *= 0.98;
                    }
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ff0055";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }

            function assignTargets(targets) {
                for (let i = 0; i < particles.length; i++) {
                    const target = targets[i % targets.length];
                    particles[i].targetX = target.x + (Math.random() - 0.5) * 5;
                    particles[i].targetY = target.y + (Math.random() - 0.5) * 5;
                }
            }

            assignTargets(textTargetPoints);

            function animate() {
                ctx.fillStyle = 'rgba(10, 0, 5, 0.25)';
                ctx.fillRect(0, 0, width, height);

                phaseTimer++;

                if (phase === 'text' && phaseTimer > 180) {
                    phase = 'heart';
                    assignTargets(heartTargetPoints);
                } else if (phase === 'heart' && phaseTimer > 360) {
                    phase = 'exploded';
                    particles.forEach(p => {
                        const angle = Math.random() * Math.PI * 2;
                        const force = Math.random() * 12 + 4;
                        p.vx = Math.cos(angle) * force;
                        p.vy = Math.sin(angle) * force;
                    });
                    
                    const btn = document.getElementById("enterSiteBtn");
                    btn.style.display = "block";
                    setTimeout(() => { btn.style.opacity = "1"; }, 100);
                }

                if (phase === 'heart') {
                    const beat = Math.sin(phaseTimer * 0.1) * 3;
                    particles.forEach(p => {
                        p.x += (p.x - width/2) * 0.005 * beat;
                        p.y += (p.y - height/2) * 0.005 * beat;
                    });
                }

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                animId = requestAnimationFrame(animate);
            }

            animate();
        }

        function enterMainSite() {
            const overlay = document.getElementById("heartAnimOverlay");
            overlay.style.opacity = "0";
            
            setTimeout(() => {
                overlay.style.display = "none";
                cancelAnimationFrame(animId);
                
                document.getElementById("text").style.display = "block";
                document.getElementById("gallery").style.display = "block";
                document.getElementById("bottomBtns").style.display = "block";
                document.getElementById("controls").style.display = "flex";

        const musicList = [

            { n: "CAMBAZ", f: "müzik3.mp3.mp3", i: "kapak3.jpeg.png" },
            { n: "AŞK DURDUKÇA", f: "müzik4.mp3.mp3", i: "kapak4.jpeg.png" },
            { n: "HARD CORE MELANKOLİ", f: "müzik5.mp3.mp3", i: "kapak5.jpeg.png" },
            { n: "TUTAMIYORUM ZAMANI", f: "müzik6.mp3.mp3", i: "kapak6.jpeg.png" },
            { n: "ARNAVUT KALDIRIMI", f: "müzik7.mp3..mp3", i: "kapak7.jpeg.png" },
            { n: "MAVİ BERE", f: "müzik9.mp3.mp3", i: "kapak9.jpeg.jpeg" },
            { n: "SARI SAÇLARIN", f: "müzik10.mp3.mp3", i: "kapak10.jpeg.jpeg" },
            { n: "ZEYNEPİM ♥", f: "müzik8.mp3.mp3", i: "kapak8.jpeg.jpeg" }

        let mIdx = 0;

        function start() {

        function loadS(i) {

        function pPause() { aud.paused ? (aud.play(), document.getElementById("pBtn").innerText="⏸") : (aud.pause(), document.getElementById("pBtn").innerText="▶️"); }
        function next() { mIdx = (mIdx + 1) % musicList.length; loadS(mIdx); aud.play(); }

        function closeAnilar() {

        function playMemory(num) {

        /* MANZARA DEĞİŞTİRME LİSTESİ */
        const bgList = [
            'sahil.jpg',
            'arka-plan.gif.gif',
            'arka-plan2.gif.gif'
        ];
        let bgIdx = 0;
        function changeBG() {
            bgIdx = (bgIdx + 1) % bgList.length;
            document.body.style.backgroundImage = `url('${bgList[bgIdx]}')`;
        }

        let rainMode = 'snow';
        let rainInt;
        function startRain() {
            if(rainInt) clearInterval(rainInt);
            rainInt = setInterval(() => {
                const el = document.createElement(rainMode === 'snow' ? 'div' : 'img');
                if(rainMode === 'snow') { el.innerHTML = '❄'; el.className = 'snowflake'; }
                else { el.src = 'hellokitty.png.png'; el.className = 'kitty-rain'; }
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = Math.random() * 3 + 2 + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 5000);
            }, 300);
        }
        function toggleRain() { rainMode = (rainMode === 'snow' ? 'kitty' : 'snow'); startRain(); }

        const resimListesi = [
            "resim1.jpeg.jpeg", "resim2.jpeg.jpeg", "resim3.jpeg.jpeg", "resim4.jpeg.jpeg", "resim5.jpeg.jpeg",
            "resim6.jpeg.jpeg", "resim7.jpeg.jpeg", "resim8.jpeg.jpeg", "resim9.jpeg.jpeg", "resim10.jpeg.jpeg",
            "resim11.jpeg.jpeg", "resim12.jpeg.jpeg", "resim13.jpeg.jpeg", "resim14.jpeg.jpeg",
            "resim15.jpeg.png", "resim16.jpeg.png", "resim17.jpeg.png", "resim18.jpeg.png", "resim19.jpeg.png",
            "resim20.jpeg.png", "resim21.jpeg.png", "resim22.jpeg.png", "resim23.jpeg.jpeg"
        ];

        function createGallery() {
            const gal = document.getElementById("gallery");
            resimListesi.forEach((src, i) => {
                const img = document.createElement('img');
                img.src = src; 
                img.className = 'slide' + (i === 0 ? ' active' : '');
                gal.appendChild(img);
            });
        }

        let sIdx = 0;
        function nextSlide() {
            const s = document.querySelectorAll('.slide');
            if(s.length === 0) return;
            s[sIdx].classList.remove('active');
            sIdx = (sIdx + 1) % s.length;
            s[sIdx].classList.add('active');
        }

        function openGamesMenu() { document.getElementById('gamesMenu').style.display='block'; }
        function closeGamesMenu() { document.getElementById('gamesMenu').style.display='none'; }
        function toggleChat() { 
            const c = document.getElementById('chatOverlay');
            c.style.display = (c.style.display === 'flex' ? 'none' : 'flex');
        }

        function showBlockBlast() {
            closeGamesMenu();
            document.getElementById('gameOverlayScreen').style.display='flex';
            document.getElementById('blockBlastContent').style.display='block';
            document.getElementById('learningGame').style.display='none';
            initBlockBlast();
        }

        function showLearningGame() {
            closeGamesMenu();
            document.getElementById('gameOverlayScreen').style.display='flex';
            document.getElementById('blockBlastContent').style.display='none';
            document.getElementById('learningGame').style.display='flex';
            nextLearnQ();
        }

        function backToMenu() {
            document.getElementById('gameOverlayScreen').style.display='none';
            openGamesMenu();
        }

        function initBlockBlast() {
            const grid = document.getElementById('mainGameGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'board-cell';
                cell.onclick = function() { this.classList.toggle('filled'); };
                grid.appendChild(cell);
            }
        }

        const learnData = [
            { q: "Kalbin hangi tarafta atıyor?", a: "Sol" },
            { q: "Yemek yerken genellikle hangi elini kullanırsın?", a: "Sağ" },
            { q: "Araba sürerken direksiyon genellikle nerede olur?", a: "Sol" }
        ];
        let currentA = "";
        function nextLearnQ() {
            const r = learnData[Math.floor(Math.random()*learnData.length)];
            document.getElementById('qText').innerText = r.q;
            currentA = r.a;
            document.getElementById('learnFeedback').innerText = "";
        }
        function checkDir(d) {
            if(d === currentA) {
                document.getElementById('learnFeedback').innerText = "DOĞRU! 🎉";
                setTimeout(nextLearnQ, 1500);
            } else {
                document.getElementById('learnFeedback').innerText = "Tekrar dene prenses! 🌸";
            }
        }
    </script>
</body>
</html>
